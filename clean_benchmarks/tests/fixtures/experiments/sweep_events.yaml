# GPU events on vs off for every harness system of dense.yaml (REPORT ONLY): each
# system swept over gpu_events alone, on the first 3 files, one run per variant. `bench sweep`
# prints events_table.md (median on / off, difference, round spread, "worth a look" when
# |diff| > max(0.5 %, spread); one run per side: "no spread: not decidable"; CPU backends n/a).
# Nothing is picked or changed: set `gpu_events: off` by hand if needed. The on / off order
# alternates per system (on, off; then off, on; ...), so neither mode is always first.
# `bench sweep --rounds 3` for a spread; `--set subset.files=N` for more files.
# The CPU dev fixture (tests, --dev runs): its cpu system has no CUDA events (n/a).

name: s4_sweep_events
base: dense.yaml
sweep:
  - system: cpu
    grid: {gpu_events: ["on", "off"]}
subset: {files: 3}
