# FineWeb-100M sparse (gte), exact top-1000 dot: nova-bf vs cuVS (patched sparse) vs SPARe.
# The few-file studies (sparemodes, batchtune, events, project) are sweep files:

name: sparse_fineweb
modality: sparse
corpus:
  path: ${READ}/
  column: sparse_embedding
  recursive: true                             # the files sit in shard sub-prefixes 00/ .. 99/
  region: us-east-1                           # the bucket's region
queries:
  path: ~/data/queries_fineweb.parquet        # the `queries` step's output (run by `bench launch`)
  column: sparse_embedding
  nq: 10000                                   # every query in the file
search: {k: 1000, metric: ip}                 # nova-bf config: dot
# FineWeb-100M: the first 101 files of the corpus in path order (all in shard 00/), 100,032,238 rows
subset: {files: 101}
io:
  # the default for every system (a system's own `io:` overrides it) (4 files in flight, 512 ranged GETs of 16 MiB parts)
  files_in_flight: 4
  gets: 512
  part_mib: 16
  read_mode: native
  range_scope: total
threads: 32          # one per vCPU of the g5.8xlarge, for every leg
copies:              # pinned and overlapped both ways, for every GPU baseline
  h2d: pinned
  h2d_overlap: true
  d2h: pinned
  d2h_overlap: true
search_name: sparse  # legs are sparse__<system>__r<N>
systems:             # round-1 order: novabf, cuvs, spare, then the +proj lines
  novabf:
    system: novabf
    # stock nova-bf: no NOVABF_RANGED_CONC / NOVABF_TWOPASS_MIN_ROWS override
    # (its own defaults)
    config: ../novabf/fineweb_100m_sparse_k1000.yaml
  # cuVS's stock sparse batch sizes until tuned (no cuvs_sparse_batches knob set).
  # A chosen value goes here with chosen_from (sweeps/sparse_batchtune).
  cuvs: {system: cuvs, preset: stock}
  # our batched SPARe, dot mode, at its default memory budget (spare_max_mib unset)
  spare: {system: spare, preset: batched_dot}
  # cuVS and SPARe also run with nova-bf's query-vocabulary projection (nova-bf always projects
  # inside its timed scan), so the comparison covers both: the cuvs / spare lines plus
  # sparse_project: query-vocab (labelled +proj in summary.md)
  cuvs_proj: {system: cuvs, preset: stock, sparse_project: query-vocab}
  spare_proj: {system: spare, preset: batched_dot, sparse_project: query-vocab}
novabf_output: ${WRITE}   # legs write <this>/<run id>/<tag>
protocol: {rounds: 3}                         # the reported value is the median of 3 rotated rounds
# the node's data prep: ship the MS MARCO shared queries file, then write its 10,000 sparse
# queries (query_set dense_sparse, the public release's order) to queries.path
prep:
  stage:
    - {key: FINEWEB_QUERIES, path: data/ms_marco_shared_queries_fp32.parquet,
       source: fineweb_redo_files/ms_marco_shared_queries_fp32.parquet, how: copy}
  queries:
    script: bench/prep/prep_queries_fineweb.py
    args: [~/sky_workdir/data/ms_marco_shared_queries_fp32.parquet, ~/data]
