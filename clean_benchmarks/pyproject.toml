[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bench"
version = "0.0.0"
description = "clean_benchmarks: one command per paper experiment"
requires-python = ">=3.12"
# no dependencies at install or import time: the engines' libraries come from the paper env
dependencies = []

[project.scripts]
bench = "bench.cli:main"

[tool.setuptools.packages.find]
include = ["bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/reference"]
markers = [
    "slow: over ~2 s, or end-to-end bench run / sweep / nova-bf / reference runs; the fast tier is -m 'not slow'",
]
